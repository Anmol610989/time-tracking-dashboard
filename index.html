<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <!-- <script src="app.js" defer></script> -->
    <script src="index.js" defer></script>
    <link rel="stylesheet" href="style.css" />
    <title>Frontend Mentor | Time tracking dashboard</title>
  </head>
  <body>
    <section>
      <div class="display-flex">
        <div class="grid-container">
          <div class="item-1 br">
            <div class="person-info">
              <div><img src="./images/image-jeremy.png" alt="" /></div>
              <div>
                <p class="report">Report for</p>
                <p class="person-name">Jeremy Robson</p>
              </div>
            </div>

            <div class="report-span">
              <button class="btn daily">Daily</button>
              <button class="btn weekly">Weekly</button>
              <button class="btn monthly">Monthly</button>
            </div>
          </div>
        </div>
        <div class="display-grid"></div>
      </div>

    </section>
  </body>
</html>
